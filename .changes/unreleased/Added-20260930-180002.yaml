kind: Added
body: New -wait-timeout flag on plan, apply and destroy (default 1h) limits how long the CLI waits on a plan approval or policy gate decision, whether asked for at the terminal or being made in the Tharsis UI, before leaving the run waiting and exiting 1; plan also gains the -input flag.

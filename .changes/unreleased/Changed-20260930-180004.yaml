kind: Changed
body: With -input=false (or without an interactive terminal), apply and destroy still leave the run waiting for plan approval in the Tharsis UI and exit 0, but first follow any policy stages before it; if a policy gate needs a decision, the run is left waiting at the gate and the CLI exits 1. Pass -wait to wait for these decisions in the Tharsis UI instead.
